name: Deploy Customer QR UAT
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
jobs:
  deploy-customer-uat:
    if: >-
      github.head_ref == 'feature/customer-qr-ordering-foundation' ||
      github.ref == 'refs/heads/feature/customer-qr-ordering-foundation' ||
      github.head_ref == 'feature/production-rollout-hardening' ||
      github.ref == 'refs/heads/feature/production-rollout-hardening' ||
      github.head_ref == 'feature/production-security-authorization' ||
      github.ref == 'refs/heads/feature/production-security-authorization' ||
      github.head_ref == 'feature/trusted-customer-boundary' ||
      github.ref == 'refs/heads/feature/trusted-customer-boundary' ||
      github.head_ref == 'feature/anonymous-abuse-controls' ||
      github.ref == 'refs/heads/feature/anonymous-abuse-controls' ||
      github.head_ref == 'feature/wp-cc-02-catalogue-admin' ||
      github.ref == 'refs/heads/feature/wp-cc-02-catalogue-admin'
    runs-on: ubuntu-latest
    environment: customer-qr-uat
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm test:rules && pnpm lint
      - name: Build isolated Customer QR UAT app
        env:
          VITE_APP_ENVIRONMENT: customer-qr-uat
          VITE_CUSTOMER_QR_ENABLED: "true"
          VITE_FIREBASE_API_KEY: ${{ secrets.CUSTOMER_UAT_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.CUSTOMER_UAT_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.CUSTOMER_UAT_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_APP_ID }}
        run: |
          for variable in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            test -n "${!variable}" || { echo "Missing required Customer QR UAT secret: $variable"; exit 1; }
          done
          test "$VITE_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test "$VITE_FIREBASE_PROJECT_ID" != "greek-yogert"
          test "$VITE_APP_ENVIRONMENT" = "customer-qr-uat"
          test "$VITE_CUSTOMER_QR_ENABLED" = "true"
          pnpm build
      - name: Inspect exact WP-CC-02 Thai UAT records
        if: github.head_ref == 'feature/wp-cc-02-catalogue-admin' || github.ref == 'refs/heads/feature/wp-cc-02-catalogue-admin'
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/wp-cc-02-thai-uat-inspection.json
        run: |
          test "$SOURCE_BRANCH" = "feature/wp-cc-02-catalogue-admin"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" != "greek-yogert"
          test -n "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          node --input-type=module <<'NODE'
          import { applicationDefault, deleteApp, initializeApp } from "firebase-admin/app";
          import { getFirestore } from "firebase-admin/firestore";

          const projectId = process.env.CUSTOMER_UAT_FIREBASE_PROJECT_ID;
          if (projectId !== "greek-yogert-customer-uat-2026" || projectId === "greek-yogert")
            throw new Error("WP-CC-02 inspection project mismatch");
          const app = initializeApp({ credential: applicationDefault(), projectId });
          const database = getFirestore(app);
          const exactNames = ["ทดสอบ UAT 2", "ทดสอบ UAT 3"];
          const namedGroups = await database
            .collection("optionGroups")
            .where("displayName", "in", exactNames)
            .get();
          const groupIds = new Set(["group-uat-2", "group-uat-3"]);
          namedGroups.docs.forEach((snapshot) => groupIds.add(snapshot.id));
          const groups = [];
          for (const groupId of [...groupIds].sort()) {
            const privateGroup = await database.doc(`optionGroups/${groupId}`).get();
            const choices = await database
              .collection(`optionGroups/${groupId}/choices`)
              .limit(51)
              .get();
            const publicGroup = await database
              .doc(`publicOptionGroups/${groupId}`)
              .get();
            groups.push({
              groupPath: privateGroup.ref.path,
              metadataExists: privateGroup.exists,
              matchingName:
                privateGroup.exists && exactNames.includes(privateGroup.get("displayName")),
              choicePaths: choices.docs
                .filter((snapshot) => snapshot.get("name") === "ทดสอบ")
                .map((snapshot) => snapshot.ref.path)
                .sort(),
              totalChoiceDocuments: choices.size,
              publicPath: publicGroup.ref.path,
              publicExists: publicGroup.exists,
            });
          }
          const control = await database
            .doc("publicProjectionControl/current")
            .get();
          const optionGroupIds =
            control.exists && Array.isArray(control.get("optionGroupIds"))
              ? control.get("optionGroupIds")
              : [];
          console.log(
            `WP-CC-02 Thai UAT inspection: ${JSON.stringify({
              groups,
              control: {
                path: control.ref.path,
                exists: control.exists,
                schemaVersion: control.exists ? control.get("schemaVersion") : null,
                fingerprint: control.exists ? control.get("fingerprint") : null,
                containsTestGroup: [...groupIds].some((id) =>
                  optionGroupIds.includes(id),
                ),
              },
            })}`,
          );
          await deleteApp(app);
          NODE
      - name: Capture preserved WP4 Human-UAT evidence before deployment
        if: github.head_ref == 'feature/anonymous-abuse-controls' || github.ref == 'refs/heads/feature/anonymous-abuse-controls'
        env:
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          CUSTOMER_UAT_MANAGER_EMAIL: greekmore.uat@gmail.com
          CUSTOMER_UAT_ORDINARY_STAFF_EMAIL: greekmore.staff.uat@gmail.com
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/customer-uat-service-account.json
          CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" != "greek-yogert"
          test -n "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          pnpm uat:wp4:human-diagnostics
      - name: Deploy isolated UAT Firebase resources
        if: github.head_ref != 'feature/wp-cc-02-catalogue-admin' && github.ref != 'refs/heads/feature/wp-cc-02-catalogue-admin'
        env:
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/customer-uat-service-account.json
        run: |
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test -n "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          node scripts/disableUatCustomerOrdering.mjs
          pnpm dlx firebase-tools@15.23.0 deploy --config firebase.customer-uat.json --project "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" --only hosting,firestore:rules,firestore:indexes --non-interactive
      - name: Detect WP-CC-02 Firestore Rules change
        id: wp-cc-02-rules-change
        if: github.head_ref == 'feature/wp-cc-02-catalogue-admin' || github.ref == 'refs/heads/feature/wp-cc-02-catalogue-admin'
        env:
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed=false
          if [ "$EVENT_ACTION" = "synchronize" ] && [ -n "$BEFORE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            if ! git diff --quiet "$BEFORE_SHA" "$EXPECTED_SHA" -- firestore.production.rules; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Firestore Rules changed in this publication: $changed"
      - name: Deploy WP-CC-02 isolated Firestore Rules
        if: >-
          (github.head_ref == 'feature/wp-cc-02-catalogue-admin' ||
          github.ref == 'refs/heads/feature/wp-cc-02-catalogue-admin') &&
          steps.wp-cc-02-rules-change.outputs.changed == 'true'
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/customer-uat-service-account.json
        run: |
          test "$SOURCE_BRANCH" = "feature/wp-cc-02-catalogue-admin"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" != "greek-yogert"
          test -n "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e "const credential=JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')); if (credential.project_id !== process.env.CUSTOMER_UAT_FIREBASE_PROJECT_ID) throw new Error('UAT credential project mismatch')"
          node -e "const config=require('./firebase.customer-uat.json'); if (config.firestore?.rules !== 'firestore.production.rules' || !config.hosting || config.functions || config.database || config.storage) throw new Error('WP-CC-02 UAT config permits only Firestore and Hosting resources')"
          rules_sha256=$(sha256sum firestore.production.rules | awk '{print $1}')
          echo "Exact source: $EXPECTED_SHA"
          echo "Firebase project: $CUSTOMER_UAT_FIREBASE_PROJECT_ID"
          echo "Deployment scope: Firestore Rules only"
          echo "Firestore Rules SHA-256: $rules_sha256"
          pnpm dlx firebase-tools@15.23.0 deploy \
            --config firebase.customer-uat.json \
            --project "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" \
            --only firestore:rules \
            --non-interactive
          {
            echo "### WP-CC-02 isolated Firestore Rules"
            echo ""
            echo "- Exact source: \`$EXPECTED_SHA\`"
            echo "- Firebase project: \`$CUSTOMER_UAT_FIREBASE_PROJECT_ID\`"
            echo "- Deployment scope: Firestore Rules only"
            echo "- Rules SHA-256: \`$rules_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy WP-CC-02 isolated Hosting preview
        id: deploy-wp-cc-02-preview
        if: github.head_ref == 'feature/wp-cc-02-catalogue-admin' || github.ref == 'refs/heads/feature/wp-cc-02-catalogue-admin'
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/customer-uat-service-account.json
        run: |
          test "$SOURCE_BRANCH" = "feature/wp-cc-02-catalogue-admin"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" != "greek-yogert"
          test -n "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e "const credential=JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')); if (credential.project_id !== process.env.CUSTOMER_UAT_FIREBASE_PROJECT_ID) throw new Error('UAT credential project mismatch')"
          node -e "const config=require('./firebase.customer-uat.json'); if (config.firestore?.rules !== 'firestore.production.rules' || !config.hosting || config.functions || config.database || config.storage) throw new Error('WP-CC-02 UAT config permits only Firestore and Hosting resources'); if (config.hosting.public !== 'dist') throw new Error('WP-CC-02 preview must deploy dist')"
          echo "Exact source: $EXPECTED_SHA"
          echo "Application environment: customer-qr-uat"
          echo "Firebase project: $CUSTOMER_UAT_FIREBASE_PROJECT_ID"
          echo "Deployment scope: Hosting preview channel only"
          result_file="$RUNNER_TEMP/firebase-wp-cc-02-preview-result.json"
          pnpm dlx firebase-tools@15.23.0 hosting:channel:deploy wp-cc-02-catalogue \
            --config firebase.customer-uat.json \
            --project "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" \
            --expires 7d \
            --no-authorized-domains \
            --non-interactive \
            --json > "$result_file"
          preview_url=$(node -e "const data=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); const urls=[]; const visit=(value)=>{ if (typeof value === 'string' && /^https:\/\//.test(value)) urls.push(value); else if (Array.isArray(value)) value.forEach(visit); else if (value && typeof value === 'object') Object.values(value).forEach(visit); }; visit(data.result); const url=urls.find((value)=>value.includes('--wp-cc-02-catalogue-')) || urls[0]; if (!url) process.exit(1); process.stdout.write(url);" "$result_file")
          preview_expiry=$(node -e "const data=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); const expiries=[]; const visit=(value)=>{ if (Array.isArray(value)) value.forEach(visit); else if (value && typeof value === 'object') Object.entries(value).forEach(([key,child])=>{ if (/expir/i.test(key) && typeof child === 'string' && !Number.isNaN(Date.parse(child))) expiries.push(child); visit(child); }); }; visit(data.result); if (!expiries.length) process.exit(1); expiries.sort((left,right)=>Date.parse(left)-Date.parse(right)); process.stdout.write(new Date(expiries[0]).toISOString());" "$result_file")
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "preview_expiry=$preview_expiry" >> "$GITHUB_OUTPUT"
          {
            echo "### WP-CC-02 catalogue Human UAT preview"
            echo ""
            echo "- Exact source: \`$EXPECTED_SHA\`"
            echo "- Application environment: \`customer-qr-uat\`"
            echo "- Firebase project: \`$CUSTOMER_UAT_FIREBASE_PROJECT_ID\`"
            echo "- Deployment scope: Hosting Preview Channel only (Firestore Rules run only when changed)"
            echo "- Firebase Hosting channel: \`wp-cc-02-catalogue\`"
            echo "- Preview expiry: \`$preview_expiry\`"
            echo "- Staff URL: [$preview_url/]($preview_url/)"
            echo "- Customer URL: [$preview_url/order]($preview_url/order)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run WP4 security and operational-control UAT
        if: github.head_ref == 'feature/anonymous-abuse-controls' || github.ref == 'refs/heads/feature/anonymous-abuse-controls'
        env:
          CUSTOMER_UAT_FIREBASE_API_KEY: ${{ secrets.CUSTOMER_UAT_FIREBASE_API_KEY }}
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/customer-uat-service-account.json
        run: |
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" != "greek-yogert"
          test -n "$CUSTOMER_UAT_FIREBASE_API_KEY"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          pnpm uat:wp4
      - name: Verify capable and designate ordinary Human-UAT Staff accounts
        if: github.head_ref == 'feature/anonymous-abuse-controls' || github.ref == 'refs/heads/feature/anonymous-abuse-controls'
        env:
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          CUSTOMER_UAT_MANAGER_EMAIL: greekmore.uat@gmail.com
          CUSTOMER_UAT_ORDINARY_STAFF_EMAIL: greekmore.staff.uat@gmail.com
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/customer-uat-service-account.json
        run: |
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" != "greek-yogert"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          pnpm uat:wp4:designate-staff
      - name: Securely update the existing ordinary UAT Staff password when requested
        if: github.head_ref == 'feature/anonymous-abuse-controls' || github.ref == 'refs/heads/feature/anonymous-abuse-controls'
        env:
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          CUSTOMER_UAT_MANAGER_EMAIL: greekmore.uat@gmail.com
          CUSTOMER_UAT_ORDINARY_STAFF_EMAIL: greekmore.staff.uat@gmail.com
          CUSTOMER_UAT_ORDINARY_STAFF_PASSWORD: ${{ secrets.CUSTOMER_UAT_ORDINARY_STAFF_PASSWORD }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/customer-uat-service-account.json
        run: |
          if [ -z "$CUSTOMER_UAT_ORDINARY_STAFF_PASSWORD" ]; then
            echo "No ephemeral ordinary Staff password is present; secure update not requested."
            exit 0
          fi
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" != "greek-yogert"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          pnpm uat:wp4:set-ordinary-password
      - name: Capture read-only WP3 Human UAT diagnostics
        if: github.head_ref == 'feature/trusted-customer-boundary' || github.ref == 'refs/heads/feature/trusted-customer-boundary'
        env:
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/customer-uat-service-account.json
        run: |
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test -n "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          pnpm uat:wp3:diagnose
      - name: Install isolated UAT browser
        if: github.head_ref == 'feature/trusted-customer-boundary' || github.ref == 'refs/heads/feature/trusted-customer-boundary' || github.head_ref == 'feature/anonymous-abuse-controls' || github.ref == 'refs/heads/feature/anonymous-abuse-controls'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run WP3 browser UAT and clean temporary data
        if: github.head_ref == 'feature/trusted-customer-boundary' || github.ref == 'refs/heads/feature/trusted-customer-boundary'
        env:
          CUSTOMER_UAT_FIREBASE_API_KEY: ${{ secrets.CUSTOMER_UAT_FIREBASE_API_KEY }}
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/customer-uat-service-account.json
        run: |
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test -n "$CUSTOMER_UAT_FIREBASE_API_KEY"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          pnpm uat:wp3:browser
      - name: Run WP4 Customer-to-Staff browser rehearsal and exact cleanup
        if: github.head_ref == 'feature/anonymous-abuse-controls' || github.ref == 'refs/heads/feature/anonymous-abuse-controls'
        env:
          CUSTOMER_UAT_FIREBASE_API_KEY: ${{ secrets.CUSTOMER_UAT_FIREBASE_API_KEY }}
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/customer-uat-service-account.json
        run: |
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" != "greek-yogert"
          test -n "$CUSTOMER_UAT_FIREBASE_API_KEY"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          pnpm uat:wp4:browser
      - name: Run reduced existing ordinary-Staff browser UAT
        if: github.head_ref == 'feature/anonymous-abuse-controls' || github.ref == 'refs/heads/feature/anonymous-abuse-controls'
        env:
          CUSTOMER_UAT_FIREBASE_API_KEY: ${{ secrets.CUSTOMER_UAT_FIREBASE_API_KEY }}
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          CUSTOMER_UAT_MANAGER_EMAIL: greekmore.uat@gmail.com
          CUSTOMER_UAT_ORDINARY_STAFF_EMAIL: greekmore.staff.uat@gmail.com
          CUSTOMER_UAT_ORDINARY_STAFF_PASSWORD: ${{ secrets.CUSTOMER_UAT_ORDINARY_STAFF_PASSWORD }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/customer-uat-service-account.json
        run: |
          if [ -z "$CUSTOMER_UAT_ORDINARY_STAFF_PASSWORD" ]; then
            echo "No ephemeral ordinary Staff password is present; reduced account UAT not requested."
            exit 0
          fi
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" != "greek-yogert"
          test -n "$CUSTOMER_UAT_FIREBASE_API_KEY"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          pnpm uat:wp4:ordinary-staff-browser
      - name: Fail-close UAT intake after a WP4 workflow failure
        if: failure() && (github.head_ref == 'feature/anonymous-abuse-controls' || github.ref == 'refs/heads/feature/anonymous-abuse-controls')
        env:
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/customer-uat-service-account.json
        run: |
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test -n "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          node scripts/disableUatCustomerOrdering.mjs
