name: Deploy catalogue Storage Rules to isolated UAT

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed commit SHA
        required: true
        type: string
      storage_gate_approval:
        description: Type APPROVED_ISOLATED_UAT_STORAGE after billing and Rules service permission approval
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-storage-rules:
    if: inputs.storage_gate_approval == 'APPROVED_ISOLATED_UAT_STORAGE'
    runs-on: ubuntu-latest
    environment: customer-qr-uat
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 1
      - name: Verify exact approved source
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          printf '%s' "$APPROVED_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:storage-rules
      - name: Deploy only isolated-UAT Storage Rules
        env:
          CUSTOMER_UAT_FIREBASE_PROJECT_ID: ${{ secrets.CUSTOMER_UAT_FIREBASE_PROJECT_ID }}
          CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/customer-uat-service-account.json
        run: |
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" = "greek-yogert-customer-uat-2026"
          test "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" != "greek-yogert"
          test -n "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$CUSTOMER_UAT_FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e "const fs=require('fs');const value=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));if(value.project_id!==process.env.CUSTOMER_UAT_FIREBASE_PROJECT_ID)process.exit(1)"
          pnpm dlx firebase-tools@15.23.0 deploy \
            --config firebase.customer-uat.json \
            --project "$CUSTOMER_UAT_FIREBASE_PROJECT_ID" \
            --only storage \
            --non-interactive
